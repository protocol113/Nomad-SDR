[platformio]
default_envs = radiomaster_nomad, radiomaster_xr4

[env:radiomaster_nomad]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default.csv
monitor_speed = 921600
build_flags = -Wall -Wextra -I../pico/firmware
extra_scripts = post:package.py


; RadioMaster XR4 (Gemini Xrossband RX): same ESP32 + dual LR1121, radio 0 RESET
; on GPIO26, one LED, no fan/PA/backpack. No USB port: flash and talk over the
; RX/TX solder pads (UART0, GPIO3/GPIO1) with a 3.3 V USB-serial adapter.
[env:radiomaster_xr4]
extends = env:radiomaster_nomad
build_flags = ${env:radiomaster_nomad.build_flags} -DBOARD_RADIOMASTER_XR4 -DNOMAD_AP_SSID=\"XR4-SDR\"
